name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile check
        run: python3 -m py_compile windows_usb_flasher.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
